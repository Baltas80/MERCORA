services:
  app:
    networks:
      - backend
      - onion_edge

  tor:
    image: svengo/tor:0.4.9.12
    restart: unless-stopped
    # The image entrypoint generates /etc/tor/torrc-defaults at startup,
    # so the container filesystem cannot be globally read-only.
    # Keep privilege reduction in place and expose only the persistent /data volume.
    environment:
      ORPORT: "0"
      DIRPORT: "0"
      EXITPOLICY: "reject *:*"
    command:
      - tor
      - -f
      - /data/torrc
      - --ORPort
      - "0"
      - --DirPort
      - "0"
      - --ExitPolicy
      - "reject *:*"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - tor_data:/data
      - ./tor/torrc.onion.secure:/data/torrc:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /data/mercora/hostname &&
          tor --verify-config -f /data/torrc >/dev/null 2>&1 &&
          wget -qO- --timeout=5 http://app:8080/api/healthz >/dev/null 2>&1
    networks:
      - onion_edge
      - tor_egress

networks:
  onion_edge:
    internal: true
  tor_egress:
    driver: bridge

volumes:
  tor_data:
