<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MERCORA — Account Preview</title><link rel="stylesheet" href="./styles.css"></head><body><div class="site-shell"><header class="topbar"><a class="brand" href="./">MERCORA</a><span class="muted">ACCOUNT PREVIEW</span></header><main class="section"><div class="split"><section class="system-panel"><div class="panel-title">DEMO ACCOUNT</div><form id="accountForm"><label>Pseudonym<input name="pseudonym" minlength="3" maxlength="32" required></label><label>Password<input name="password" type="password" minlength="12" required></label><button class="button button-primary" type="submit">Enter demo</button><p id="message" class="muted"></p></form></section><aside class="system-panel"><div class="panel-title">PRIVACY BOUNDARY</div><p class="muted">This is a static visual preview. No real account, password or recovery code is stored.</p></aside></div></main></div><script>document.querySelector('#accountForm').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#message').textContent='PREVIEW — no real account was created.'})</script></body></html>
