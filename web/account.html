<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MERCORA — Account Preview</title><link rel="stylesheet" href="./styles.css"></head><body><div class="site-shell"><header class="topbar"><a class="brand" href="./">MERCORA</a><span class="admin-title">ACCOUNT PREVIEW</span></header><main class="section"><div class="split"><section class="system-panel"><div class="panel-title">DEMO ACCOUNT</div><form id="loginForm"><label>Pseudónimo<input name="pseudonym" minlength="3" maxlength="32" required></label><label>Contraseña<input name="password" type="password" minlength="12" maxlength="1024" required></label><button class="button button-primary" type="submit">Entrar en demo</button></form><form id="registerForm"><label>Nuevo pseudónimo<input name="pseudonym" minlength="3" maxlength="32" required></label><label>Nueva contraseña<input name="password" type="password" minlength="12" maxlength="1024" required></label><button class="button button-ghost" type="submit">Simular registro</button></form><button id="logout" class="button button-ghost" type="button">Cerrar sesión</button><p id="message" class="muted" role="status"></p></section><aside class="system-panel"><div class="panel-title">RECUPERACIÓN · DEMO</div><p class="muted">Esta página es un prototipo visual. No crea cuentas reales ni almacena contraseñas.</p><form id="recoveryForm"><label>Pseudónimo<input name="pseudonym" required></label><label>Código<input name="recovery_code" required></label><label>Nueva contraseña<input name="new_password" type="password" minlength="12" required></label><button class="button button-primary" type="submit">Simular recuperación</button></form></aside></div></main></div><script type="module" src="./account.js"></script></body></html>
