<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MERCORA — Account</title><link rel="stylesheet" href="/styles.css"></head><body><div class="site-shell"><header class="topbar"><a class="brand" href="/">MERCORA</a></header><main class="section"><div class="split"><section class="system-panel"><div class="panel-title">CUENTA</div><form id="loginForm"><label>Pseudónimo<input name="pseudonym" minlength="3" maxlength="32" required></label><label>Contraseña<input name="password" type="password" minlength="12" maxlength="1024" required></label><button class="button button-primary" type="submit">Entrar</button></form><form id="registerForm"><label>Nuevo pseudónimo<input name="pseudonym" minlength="3" maxlength="32" required></label><label>Nueva contraseña<input name="password" type="password" minlength="12" maxlength="1024" required></label><button class="button button-ghost" type="submit">Crear cuenta</button></form><button id="logout" class="button button-ghost" type="button">Cerrar sesión</button><p id="message" class="muted" role="status"></p></section><aside class="system-panel"><div class="panel-title">RECUPERACIÓN</div><p class="muted">Los códigos de recuperación se muestran una sola vez al crear la cuenta.</p><form id="recoveryForm"><label>Pseudónimo<input name="pseudonym" required></label><label>Código<input name="recovery_code" required></label><label>Nueva contraseña<input name="new_password" type="password" minlength="12" required></label><button class="button button-primary" type="submit">Restablecer</button></form></aside></div></main></div><script type="module" src="/account.js"></script></body></html>
