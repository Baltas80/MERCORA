services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mercora
      POSTGRES_USER: mercora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercora -d mercora"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://mercora:${POSTGRES_PASSWORD}@postgres:5432/mercora
      MERCORA_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [backend]
    restart: unless-stopped

networks:
  backend:
    internal: true

volumes:
  postgres_data:
