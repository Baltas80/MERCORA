services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mercora
      POSTGRES_USER: mercora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U mercora -d mercora"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: {context: ., dockerfile: app/Dockerfile}
    command: ["python","migrate.py"]
    environment:
      DATABASE_URL: postgresql://mercora:${POSTGRES_PASSWORD}@postgres:5432/mercora
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build: {context: ., dockerfile: app/Dockerfile}
    environment:
      DATABASE_URL: postgresql://mercora:${POSTGRES_PASSWORD}@postgres:5432/mercora
      MERCORA_ENV: production
      MERCORA_ENCRYPTION_KEY_B64: ${MERCORA_ENCRYPTION_KEY_B64:?set MERCORA_ENCRYPTION_KEY_B64}
      MERCORA_PAYMENT_INGEST_SECRET: ${MERCORA_PAYMENT_INGEST_SECRET:?set MERCORA_PAYMENT_INGEST_SECRET}
      MERCORA_STORAGE_ROOT: /data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    volumes:
      - mercora_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: {context: ., dockerfile: app/Dockerfile}
    command: ["python","worker.py"]
    environment:
      DATABASE_URL: postgresql://mercora:${POSTGRES_PASSWORD}@postgres:5432/mercora
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  proxy:
    image: nginx:1.28-alpine
    depends_on: [api]
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge,backend]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  mercora_data:
