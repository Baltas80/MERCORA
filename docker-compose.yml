services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mercora
      POSTGRES_USER: mercora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_marketplace.sql:/docker-entrypoint-initdb.d/002_marketplace.sql:ro
      - ./db/003_sessions.sql:/docker-entrypoint-initdb.d/003_sessions.sql:ro
      - ./db/004_admin_management.sql:/docker-entrypoint-initdb.d/004_admin_management.sql:ro
      - ./db/005_escrow.sql:/docker-entrypoint-initdb.d/005_escrow.sql:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercora -d mercora"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://mercora:${POSTGRES_PASSWORD}@postgres:5432/mercora
      MERCORA_ENV: staging
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./runtime:/app/runtime:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    internal: true

volumes:
  postgres_data:
