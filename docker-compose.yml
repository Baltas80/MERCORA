services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mercora
      POSTGRES_USER: mercora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U mercora -d mercora"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: {context: ., dockerfile: app/Dockerfile}
    environment:
      DATABASE_URL: postgresql://mercora:${POSTGRES_PASSWORD}@postgres:5432/mercora
      MERCORA_ENV: development
      MERCORA_ENCRYPTION_KEY_B64: ${MERCORA_ENCRYPTION_KEY_B64:?set MERCORA_ENCRYPTION_KEY_B64}
      MERCORA_STORAGE_ROOT: /data
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    volumes: [mercora_data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: {context: ., dockerfile: app/Dockerfile}
    command: ["python","worker.py"]
    environment:
      DATABASE_URL: postgresql://mercora:${POSTGRES_PASSWORD}@postgres:5432/mercora
    depends_on: {postgres: {condition: service_healthy}}
    networks: [backend]
    restart: unless-stopped

  proxy:
    image: nginx:1.28-alpine
    depends_on: [api]
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge,backend]
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  mercora_data:
