<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MERCORA Admin Console</title><link rel="stylesheet" href="styles.css"></head>
<body><main id="app">
<section id="login" class="screen"><div class="brand">MERCORA</div><h1>ADMIN CONSOLE</h1><p class="muted">Private local control plane</p><form id="login-form" class="card login-card"><label for="username">Username</label><input id="username" type="text" autocomplete="username" maxlength="64" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><div class="login-actions"><button type="submit">SIGN IN</button></div><p class="muted">Authentication is handled by the production authentication service. The console keeps only the short-lived session in memory.</p><p id="login-error" class="error" hidden></p></form></section>
<section id="dashboard" class="hidden"><header class="topbar"><div><span class="brand">MERCORA</span><span class="divider">/</span><span>ADMIN CONSOLE</span></div><button id="logout" class="secondary">LOCK</button></header><div class="content"><div class="hero-row"><div><p class="eyebrow">SYSTEM CONTROL</p><h2>Infrastructure status</h2></div><span id="overall" class="badge unknown">UNKNOWN</span></div><div class="grid" id="status-grid"></div><section class="card actions"><h3>Service control</h3><div class="buttons"><button data-action="start">START MERCORA</button><button data-action="restart">RESTART MERCORA</button><button data-action="stop" class="danger">STOP MERCORA</button><button data-action="postgresStart">START POSTGRESQL</button><button data-action="postgresRestart">RESTART POSTGRESQL</button><button data-action="postgresStop" class="danger">STOP POSTGRESQL</button><button data-action="torStart">START TOR</button><button data-action="torRestart">RESTART TOR</button><button data-action="torStop" class="danger">STOP TOR</button><button data-action="recover" class="secondary">RECOVER MERCORA</button><button data-action="postgresRecover" class="secondary">RECOVER POSTGRESQL</button><button data-action="torRecover" class="secondary">RECOVER TOR</button><button data-action="health" class="secondary">HEALTH CHECK</button></div><pre id="output" aria-live="polite">Ready.</pre></section></div></section>
</main><script src="app.js"></script></body></html>
