name: Security baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-security:
    name: Repository security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect committed secret-like files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env|.*\.(pem|key|seed|secret))$|(^|/)private_key$|(^|/)authorized_clients/.*\.auth$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Forbidden secret-like file is tracked by git."
            exit 1
          fi

      - name: Detect obvious hard-coded credentials
        shell: bash
        run: |
          set -euo pipefail
          pattern='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|postgres(ql)?://[^[:space:]]+:[^$@[:space:]]+@'
          if git grep -nE "$pattern" -- ':!docs/THREAT-MODEL.md' ':!docs/SECURITY_MODEL.md'; then
            echo "Potential hard-coded credential detected. Review the match before merging."
            exit 1
          fi

      - name: Validate Docker Compose configuration
        shell: bash
        env:
          POSTGRES_PASSWORD: ci-only-invalid-placeholder
        run: docker compose config --quiet

      - name: Install application dependencies
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          python3 -m pip check

      - name: Test application
        shell: bash
        run: python3 -m unittest discover -s app -p 'test_*.py' -v

      - name: Build application container
        shell: bash
        run: docker build --file app/Dockerfile --tag mercora-app:ci app

      - name: Validate database migrations
        shell: bash
        env:
          POSTGRES_PASSWORD: ci-only-invalid-placeholder
        run: |
          set -euo pipefail
          trap 'docker compose down -v' EXIT
          docker compose up -d postgres
          for _ in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U mercora -d mercora >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose exec -T postgres psql -U mercora -d mercora < db/migrations/001_initial.sql
          docker compose exec -T postgres psql -U mercora -d mercora < db/migrations/002_authentication.sql

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f SECURITY.md
          test -f docs/THREAT-MODEL.md
          test -f docs/ARCHITECTURE.md
          test -f docs/DEPENDENCY_POLICY.md
          test -f docs/AUTHENTICATION.md
          test ! -f app/schema.sql
          test -f db/migrations/001_initial.sql
          test -f db/migrations/002_authentication.sql
