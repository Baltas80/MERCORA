name: MERCORA CI

on:
  push:
    branches: ["master", "admin-fix-413", "admin-recovery-hardening"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check for obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIE -- ':!*.md' ':!.gitignore' ':!.github/workflows/ci.yml' ':!.github/workflows/pages.yml' ':!scripts/verify-compose-security.mjs' '(BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY|mnemonic|seed phrase|private_key|wallet_seed|api[_-]?key[[:space:]]*[:=])' ; then
            echo "Potential secret material detected."
            exit 1
          fi
      - name: Check forbidden production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .env.production
          test ! -d tor/keys
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: false
      - name: Install Node dependencies
        run: npm ci --no-audit
      - name: Check server syntax
        run: node --check server/server.js
      - name: Check admin authentication syntax
        run: |
          node --check server/auth/better-auth.js
          node --check server/admin-control.js
          node --check server/admin-control-api.js
          node --check scripts/mercora-admin-api.mjs
          node --check scripts/mercora-admin.mjs
          node --check scripts/mercora-admin-create.mjs
      - name: Check frontend syntax
        run: node --check web/app.js
      - name: Verify container network isolation
        run: node scripts/verify-compose-security.mjs
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Prepare isolated admin authentication database
        env:
          BETTER_AUTH_SECRET: mercora-ci-auth-secret-0123456789-abcdef
          MERCORA_ADMIN_AUTH_DB: ${{ runner.temp }}/mercora-admin-auth.db
          MERCORA_ADMIN_TEST_PASSWORD: Mercora-CI-Password-2026!
        shell: bash
        run: |
          set -euo pipefail
          npm run admin:auth:migrate
          OWNER_TOKEN="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          OWNER_HASH="$(printf '%s' "$OWNER_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$OWNER_TOKEN"
          MERCORA_OWNER_BOOTSTRAP_TOKEN_HASH="$OWNER_HASH" MERCORA_OWNER_BOOTSTRAP_TOKEN="$OWNER_TOKEN" MERCORA_BOOTSTRAP_USERNAME=ciadmin MERCORA_BOOTSTRAP_PASSWORD="$MERCORA_ADMIN_TEST_PASSWORD" MERCORA_BOOTSTRAP_PASSWORD_CONFIRM="$MERCORA_ADMIN_TEST_PASSWORD" npm run admin:auth:create -- --non-interactive
      - name: Run unit tests
        env:
          BETTER_AUTH_SECRET: mercora-ci-auth-secret-0123456789-abcdef
          MERCORA_ADMIN_AUTH_DB: ${{ runner.temp }}/mercora-admin-auth.db
          MERCORA_ADMIN_TEST_USERNAME: ciadmin
          MERCORA_ADMIN_TEST_PASSWORD: Mercora-CI-Password-2026!
        run: npm test

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4

  admin-console-windows:
    name: Admin Console Windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate Windows service-manager PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/scripts/windows/mercora-service-manager.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Install Tauri frontend dependencies
        working-directory: admin-console
        run: npm install --no-audit
      - name: Run Rust unit tests
        working-directory: admin-console/src-tauri
        run: cargo test --lib
      - name: Build Windows Admin Console
        working-directory: admin-console
        run: npm run build
      - name: Upload Windows console bundle
        uses: actions/upload-artifact@v7
        with:
          name: mercora-admin-console-windows
          path: admin-console/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
