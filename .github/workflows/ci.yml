name: MERCORA CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIE \
            -- ':!*.md' ':!.gitignore' ':!.github/workflows/ci.yml' ':!.github/workflows/pages.yml' ':!scripts/verify-compose-security.mjs' \
            '(BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY|mnemonic|seed phrase|private_key|wallet_seed|api[_-]?key[[:space:]]*[:=])' ; then
            echo "Potential secret material detected."
            exit 1
          fi

      - name: Check forbidden production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .env.production
          test ! -d tor/keys

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check server syntax
        run: node --check server/server.js

      - name: Check frontend syntax
        run: node --check web/app.js

      - name: Verify container network isolation
        run: node scripts/verify-compose-security.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

  admin-console-windows:
    name: Admin Console Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Tauri CLI dependencies
        working-directory: admin-console
        run: npm install --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust application
        working-directory: admin-console
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS installer
        working-directory: admin-console
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mercora-admin-console-windows
          path: admin-console/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4
