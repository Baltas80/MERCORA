name: MERCORA CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIE \
            -- ':!*.md' ':!.gitignore' ':!.github/workflows/ci.yml' ':!.github/workflows/pages.yml' ':!scripts/verify-compose-security.mjs' \
            '(BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY|mnemonic|seed phrase|private_key|wallet_seed|api[_-]?key[[:space:]]*[:=])' ; then
            echo "Potential secret material detected."
            exit 1
          fi

      - name: Check forbidden production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .env.production
          test ! -d tor/keys

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check server syntax
        run: |
          node --check server/server.js
          node --check server/public-data.js
          node --check server/auth/api.js
          node --check server/auth/session.js
          node --check server/auth/password.js
          node --check server/seller/api.js
          node --check server/admin-content.js

      - name: Check frontend syntax
        run: |
          node --check web/app.js
          node --check web/account.js
          node --check web/seller.js
          node --check web/listing.js
          node --check web/legal.js

      - name: Check admin syntax
        run: |
          node --check server/admin-control.js
          node --check server/admin-control-api.js
          node --check server/admin-management.js
          node --check server/admin-escrow.js
          node --check server/admin-system.js
          node --check server/admin-management.test.js
          node --check server/admin-escrow.test.js
          node --check server/admin-system.test.js
          node --check server/admin-reputation.js
          node --check server/admin-reputation.test.js
          node --check server/admin-content.js
          node --check server/auth/api.test.js
          node --check server/auth/session.test.js
          node --check server/seller/api.test.js
          node --check server/public-data.test.js
          node --check test/admin-content.test.js
          node --check admin-console/ui/app.js
          node --check admin-console/ui/reputation.js
          node --check admin-console/ui/content-editor.js
          node --check web/account.js
          node --check web/seller.js

      - name: Verify container network isolation
        run: node scripts/verify-compose-security.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4
