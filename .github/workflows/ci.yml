name: MERCORA CI

on:
  push:
    branches: ["master", "admin-fix-413", "admin-recovery-hardening"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIE \
            -- ':!*.md' ':!.gitignore' ':!.github/workflows/ci.yml' ':!.github/workflows/pages.yml' ':!scripts/verify-compose-security.mjs' \
            '(BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY|mnemonic|seed phrase|private_key|wallet_seed|api[_-]?key[[:space:]]*[:=])' ; then
            echo "Potential secret material detected."
            exit 1
          fi

      - name: Check forbidden production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .env.production
          test ! -d tor/keys

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install --no-audit

      - name: Check server syntax
        run: node --check server/server.js

      - name: Check admin authentication syntax
        run: |
          node --check server/auth/better-auth.js
          node --check server/admin-control.js
          node --check server/admin-control-api.js
          node --check scripts/mercora-admin-api.mjs
          node --check scripts/mercora-admin.mjs
          node --check scripts/mercora-admin-create.mjs

      - name: Check frontend syntax
        run: node --check web/app.js

      - name: Verify container network isolation
        run: node scripts/verify-compose-security.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Prepare isolated admin authentication database
        env:
          BETTER_AUTH_SECRET: mercora-ci-auth-secret-0123456789-abcdef
          MERCORA_ADMIN_AUTH_DB: ${{ runner.temp }}/mercora-admin-auth.db
          MERCORA_ADMIN_TEST_PASSWORD: Mercora-CI-Password-2026!
        shell: bash
        run: |
          set -euo pipefail
          npm run admin:auth:migrate
          OWNER_TOKEN="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          OWNER_HASH="$(printf '%s' "$OWNER_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$OWNER_TOKEN"
          MERCORA_OWNER_BOOTSTRAP_TOKEN_HASH="$OWNER_HASH" \
          MERCORA_OWNER_BOOTSTRAP_TOKEN="$OWNER_TOKEN" \
          MERCORA_BOOTSTRAP_USERNAME=ciadmin \
          MERCORA_BOOTSTRAP_PASSWORD="$MERCORA_ADMIN_TEST_PASSWORD" \
          MERCORA_BOOTSTRAP_PASSWORD_CONFIRM="$MERCORA_ADMIN_TEST_PASSWORD" \
          npm run admin:auth:create -- --non-interactive

      - name: Run unit tests
        env:
          BETTER_AUTH_SECRET: mercora-ci-auth-secret-0123456789-abcdef
          MERCORA_ADMIN_AUTH_DB: ${{ runner.temp }}/mercora-admin-auth.db
          MERCORA_ADMIN_TEST_USERNAME: ciadmin
          MERCORA_ADMIN_TEST_PASSWORD: Mercora-CI-Password-2026!
        run: npm test

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4
