name: MERCORA CI

on:
  workflow_dispatch:
  push:
    branches: ["master", "feat/admin-full-management"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mercora-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIE \
            -- ':!*.md' ':!.gitignore' ':!.github/workflows/ci.yml' ':!.github/workflows/pages.yml' ':!scripts/verify-compose-security.mjs' \
            '(BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY|mnemonic|seed phrase|private_key|wallet_seed|api[_-]?key[[:space:]]*[:=])' ; then
            echo "Potential secret material detected."
            exit 1
          fi

      - name: Check forbidden production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .env.production
          test ! -d tor/keys

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check server syntax
        run: |
          node --check server/server.js
          node --check server/public-data.js
          node --check server/auth/api.js
          node --check server/auth/session.js
          node --check server/auth/password.js
          node --check server/seller/api.js
          node --check server/admin-content.js

      - name: Check frontend syntax
        run: |
          node --check web/app.js
          node --check web/account.js
          node --check web/seller.js
          node --check web/listing.js
          node --check web/legal.js
          node --check web/seller-profile.js
          node --check web/i18n.js

      - name: Check admin syntax
        run: |
          node --check server/admin-control.js
          node --check server/admin-control-api.js
          node --check server/admin-control-api.test.js
          node --check server/admin-management.js
          node --check server/admin-escrow.js
          node --check server/admin-system.js
          node --check server/admin-management.test.js
          node --check server/admin-escrow.test.js
          node --check server/admin-system.test.js
          node --check server/admin-reputation.js
          node --check server/admin-reputation.test.js
          node --check server/admin-content.js
          node --check server/auth/api.test.js
          node --check server/auth/session.test.js
          node --check server/seller/api.test.js
          node --check server/order/api.js
          node --check server/order/api.test.js
          node --check server/public-data.test.js
          node --check test/admin-content.test.js
          node --check admin-console/ui/app.js
          node --check admin-console/ui/reputation.js
          node --check admin-console/ui/content-editor.js
          node --check admin-console/ui/security.test.js
          node --check scripts/mercora-backup-scheduler.mjs
          node --check scripts/mercora-backup-scheduler.test.mjs
          node --check web/account.js
          node --check web/seller.js

      - name: Check Windows backup task least privilege
        shell: pwsh
        run: |
          $script = Get-Content -Raw -LiteralPath 'scripts/install-mercora-backup-task.ps1'
          [void][scriptblock]::Create($script)
          if ($script -match "-UserId\s+'SYSTEM'" -or $script -match '-RunLevel\s+Highest') {
            throw 'Windows backup task must not run as SYSTEM or with highest privileges.'
          }
          if ($script -notmatch '-LogonType\s+S4U' -or $script -notmatch '-RunLevel\s+Limited') {
            throw 'Windows backup task must use an explicit limited S4U principal.'
          }

      - name: Verify container network isolation
        run: node scripts/verify-compose-security.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Run backup scheduler tests
        run: npm run backup:test

      - name: Run admin console UI security test
        run: node --test admin-console/ui/security.test.js

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4
