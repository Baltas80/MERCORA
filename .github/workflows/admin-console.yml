name: MERCORA Admin Console

on:
  pull_request:
    paths:
      - 'admin-console/**'
      - '.github/workflows/admin-console.yml'
  push:
    branches: [master]
    paths:
      - 'admin-console/**'
      - '.github/workflows/admin-console.yml'

permissions:
  contents: write

concurrency:
  group: mercora-admin-console-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install admin console dependencies
        working-directory: admin-console
        run: npm install --no-audit --no-fund
      - name: Generate Tauri platform icons
        working-directory: admin-console
        run: npm run tauri -- icon src-tauri/icons/icon.svg
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Rust
        working-directory: admin-console
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Check JavaScript
        run: node --check admin-console/ui/app.js
      - name: Build Windows installer
        working-directory: admin-console
        run: npm run tauri build -- --bundles nsis
      - name: Validate installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'admin-console/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          Write-Host "Installer: $($installer.FullName)"
      - name: Publish Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'admin-console/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          $asset = 'MERCORA-Admin-Console-Windows.exe'
          Copy-Item $installer.FullName $asset -Force
          $tag = "admin-console-v0.1.${{ github.run_number }}"
          gh release create $tag $asset --title "MERCORA Admin Console $tag" --notes "Windows installer built and validated by CI from commit $env:GITHUB_SHA."
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercora-admin-console-windows
          path: MERCORA-Admin-Console-Windows.exe
          if-no-files-found: error
          retention-days: 14
