name: MERCORA visual preview

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: visual-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate frontend syntax
        run: node --check web/app.js
      - name: Package static frontend preview
        uses: actions/upload-artifact@v7
        with:
          name: mercora-web-preview
          path: web
          if-no-files-found: error
          retention-days: 14
